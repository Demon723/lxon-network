# /etc/nginx/sites-available/www.lxon.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lxon.in;

    ssl_certificate /etc/acme/lxon.in/fullchain.pem;
    ssl_certificate_key /etc/acme/lxon.in/privkey.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /tokenlist.json {
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type application/json;
        try_files /tokenlist.json =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin *;
    }

    location /rpc {
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lxon.in;
    return 301 https://$host$request_uri;
}
