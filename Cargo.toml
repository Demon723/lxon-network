[workspace]
members = [
    "crates/crypto-pqc",
    "crates/l2-sequencer",
    "crates/l3-mint",
    "crates/space-relay",
    "crates/space-node",
    "crates/networking",
    "crates/p2p",
    "crates/privacy",
    "crates/observability",
    "crates/storage",
    "crates/config",
    "crates/mayo-binding"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LXON Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6.0"
parking_lot = "0.12"
hex = "0.4"
bincode = "1.3"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1.0"
bytes = "1.5"
config = "0.14"
toml = "0.8"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
tempfile = "3.8"
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "kad", "identify", "ping", "macros", "tokio", "tcp", "noise", "yamux"] }
futures = "0.3"
async-std = "1.12"
rocksdb = "0.21"
prost = "0.12"
postcard = "1.0"
subtle = "2.5"
zeroize = "1.6"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
# Use compatible versions of post-quantum libraries
# ml-kem = "0.1"  # Temporarily commented due to compatibility issues
# ml-dsa = "0.1"  # Temporarily commented due to compatibility issues
sha3 = "0.10"
blake3 = "1.5"
proptest = "1.4"
# Alternative compatible dependencies
pqcrypto-kyber = "0.7"
pqcrypto-dilithium = "0.4"
pqcrypto-traits = "0.3"
# MAYO post-quantum cryptography
pq-mayo = "0.6"
signature = "3"
rand_core = "0.6"
# Additional networking dependencies
http-body-util = "0.1"
http = "1.0"
hyper = { version = "1.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.4"
tokio-util = "0.7"
rustls = "0.23"
webpki-roots = "0.26"
curve25519-dalek = "4.1"
chrono = "0.4"
metrics = "0.21"
prometheus = "0.13"
pin-project = "1.1"
axum = "0.7"
axum-server = "0.6"